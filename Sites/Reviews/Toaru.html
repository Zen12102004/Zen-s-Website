<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen InfinityKnight</title>
    <link rel="stylesheet" href="../../styles.css">
    <link rel="stylesheet" href="sciadv.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
    <style>
        .disclaimer{
            background-color: rgb(233, 178, 178);
            color: black;
        }
    </style>
</head>
<body class="BlueSky">
    <div id="Heading" class="goldenFiction">
        <a href="../../index.html"><img src="../../logo.jpg"></a>
        <h1>Toaru</h1>
    </div>

    <!-- The container where your dynamic markdown text will go -->
    <div id="vn" class="mainbody">
        <!-- Content loads here -->
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            fetch('./Content/Toaru/gt5.md')
                .then(response => {
                    if (!response.ok) throw new Error("Review content not found.");
                    return response.text();
                })
                .then(markdownText => {
                    document.getElementById('vn').innerHTML = marked.parse(markdownText);
                })
                .catch(error => {
                    document.getElementById('vn').innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
                });
        });
    </script>
</body>
</html>
